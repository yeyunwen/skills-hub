[workspace]
members = ["crates/core", "crates/cli", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/yeyunwen/skills-hub"
homepage = "https://github.com/yeyunwen/skills-hub"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
console = "0.15"
dirs = "6.0"
inquire = "0.9"
pathdiff = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.14"
thiserror = "2.0"
walkdir = "2.5"
which = "7.0"
zip = { version = "8.4", default-features = false, features = ["bzip2", "deflate", "deflate64"] }
tauri = { version = "2.9", features = [] }
tauri-build = { version = "2.5", features = [] }
