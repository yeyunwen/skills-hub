name: Release

run-name: Build and publish ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release Please draft tag to build (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  # The publish job intentionally has no checkout, so gh cannot infer a repo
  # from .git. Define the repository context once for every gh invocation.
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      # GitHub only exposes draft releases to tokens with push access.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/check-version.mjs "${RELEASE_TAG}"
      - name: Validate release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin "${DEFAULT_BRANCH}" --tags
          git tag --list 'v*' | node scripts/check-release-tag.mjs "${RELEASE_TAG}"
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if ! git merge-base --is-ancestor "${tag_commit}" "origin/${DEFAULT_BRANCH}"; then
            echo "Tag ${RELEASE_TAG} is not contained in ${DEFAULT_BRANCH}." >&2
            exit 1
          fi
          is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
          if [[ "${is_draft}" != "true" ]]; then
            echo "Release Please must create ${RELEASE_TAG} as a draft before packaging." >&2
            exit 1
          fi

  cli:
    name: CLI ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked -p skh-cli --release --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="skh-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/${archive}"
          cp "target/${{ matrix.target }}/release/skh" README.md LICENSE "dist/${archive}/"
          tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
          rm -rf "dist/${archive}"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "skh-${env:RELEASE_TAG}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$archive" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/skh.exe", "README.md", "LICENSE" "dist/$archive/"
          Compress-Archive -Path "dist/$archive/*" -DestinationPath "dist/$archive.zip"
          Remove-Item -Recurse -Force "dist/$archive"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --bundles dmg --no-sign --ci
          - os: macos-latest
            target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin --bundles dmg --no-sign --ci
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            tauri_args: --target x86_64-unknown-linux-gnu --bundles appimage,deb --no-sign --ci
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc --bundles nsis,msi --no-sign --ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.tauri_args }}
          uploadWorkflowArtifacts: true
          # The directory name is stable metadata; files inside keep Tauri's
          # native product-name-based filenames until the release job.
          workflowArtifactNamePattern: release-desktop-[platform]-[arch]-[bundle]

  release:
    name: Upload verified draft assets
    needs: [cli, desktop]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: downloaded-assets
      - name: Prepare release assets
        run: |
          node scripts/prepare-release-assets.mjs downloaded-assets release-assets "${RELEASE_TAG}"
          node scripts/check-release-assets.mjs release-assets "${RELEASE_TAG}"
      - name: Generate checksums
        run: |
          cd release-assets
          LC_ALL=C sha256sum * > SHA256SUMS
          cd ..
          node scripts/check-release-assets.mjs release-assets "${RELEASE_TAG}" --with-checksums
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Upload assets and standardize release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          gh release view "${RELEASE_TAG}" --json body --jq .body > current-notes.md
          node scripts/render-release-notes.mjs current-notes.md release-notes.md
          gh release edit "${RELEASE_TAG}" --notes-file release-notes.md

  verify:
    name: Verify published draft assets
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      attestations: read
      # Draft release downloads require the same push-level visibility.
      contents: write
    outputs:
      release_url: ${{ steps.release.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${RELEASE_TAG}" --dir release-assets
      - name: Verify asset inventory and checksums
        run: |
          node scripts/check-release-assets.mjs release-assets "${RELEASE_TAG}" --with-checksums
          cd release-assets
          sha256sum --check SHA256SUMS
      - name: Verify GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r -d '' asset; do
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}"
          done < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
      - name: Read release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_url="$(gh release view "${RELEASE_TAG}" --json url --jq .url)"
          echo "url=${release_url}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Approve and publish release
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: release
      url: ${{ needs.verify.outputs.release_url }}
    permissions:
      contents: write
    steps:
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json="$(gh release view "${RELEASE_TAG}" --json isDraft,isPrerelease)"
          is_draft="$(jq --raw-output .isDraft <<<"${release_json}")"
          is_prerelease="$(jq --raw-output .isPrerelease <<<"${release_json}")"
          if [[ "${is_draft}" != "true" ]]; then
            echo "${RELEASE_TAG} is no longer a draft release." >&2
            exit 1
          fi
          if [[ "${is_prerelease}" == "true" ]]; then
            gh release edit "${RELEASE_TAG}" --draft=false --prerelease=true --latest=false
          else
            gh release edit "${RELEASE_TAG}" --draft=false --prerelease=false --latest
          fi
      - name: Write summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_url="$(gh release view "${RELEASE_TAG}" --json url --jq .url)"
          {
            echo "## Release published"
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- URL: ${release_url}"
            echo "- Checksums and GitHub attestations: verified"
          } >> "${GITHUB_STEP_SUMMARY}"
