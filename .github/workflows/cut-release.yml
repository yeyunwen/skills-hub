name: Cut Release

run-name: Cut ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the version already merged to main (vX.Y.Z)
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: cut-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  cut:
    name: Validate main and create tag
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Require the default branch workflow
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "Run this workflow from ${DEFAULT_BRANCH}, not ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate version and tag availability
        run: |
          node scripts/check-version.mjs "${RELEASE_TAG}"
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Tag ${RELEASE_TAG} already exists. Never move or reuse a release tag." >&2
            exit 1
          fi
          git tag --list 'v*' | node scripts/check-release-tag.mjs "${RELEASE_TAG}"
      - name: Require successful CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_result="$(gh run list \
            --workflow ci.yml \
            --branch "${DEFAULT_BRANCH}" \
            --commit "${GITHUB_SHA}" \
            --status completed \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // ""')"
          if [[ "${ci_result}" != "success" ]]; then
            echo "The current ${DEFAULT_BRANCH} commit does not have a successful completed CI run." >&2
            exit 1
          fi
      - name: Create annotated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${RELEASE_TAG}" --message "Release ${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"
      - name: Dispatch packaging workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "${DEFAULT_BRANCH}" --field "tag=${RELEASE_TAG}"
      - name: Write summary
        run: |
          {
            echo "## Release cut"
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Next: wait for the Release workflow to create a draft, then run Publish Release."
          } >> "${GITHUB_STEP_SUMMARY}"
