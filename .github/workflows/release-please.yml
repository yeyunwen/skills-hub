name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Read release PR metadata
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        id: release-pr
        env:
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          branch="$(jq --raw-output .headBranchName <<<"${RELEASE_PR_JSON}")"
          if [[ -z "${branch}" || "${branch}" == "null" ]]; then
            echo "Release Please did not return a release PR branch." >&2
            exit 1
          fi
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          node-version: 24

      - name: Synchronize all project version files
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_PR_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          version="$(tr --delete '[:space:]' < version.txt)"
          node scripts/set-version.mjs "${version}"
          git add \
            Cargo.lock \
            Cargo.toml \
            apps/desktop/package.json \
            apps/desktop/src-tauri/tauri.conf.json \
            crates/cli/Cargo.toml \
            package.json \
            version.txt
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --message "chore: synchronize release version files"
            git push origin "HEAD:${RELEASE_PR_BRANCH}"
          fi

      - name: Run CI for the release PR commit
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: gh workflow run ci.yml --ref "${RELEASE_PR_BRANCH}"

      - name: Build the new draft release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --ref main --field "tag=${RELEASE_TAG}"
